events {}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile        on;

  server {
    listen 80;
    server_name evolve.ai;

    location / {
      root /usr/share/nginx/html/main;
      index index.html;
      try_files $uri /index.html;
    }

    # Proxy all API traffic through the API Gateway
    location /api/ {
      proxy_pass http://api-gateway:9001/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
    }

  }

  server {
    listen 80;
    server_name teacher.evolve.ai;

    location / {
      root /usr/share/nginx/html/teacher;
      index index.html;
      try_files $uri /index.html;
    }
  }

  server {
    listen 80;
    server_name student.evolve.ai;

    location / {
      root /usr/share/nginx/html/student;
      index index.html;
      try_files $uri /index.html;
    }
  }

  server {
    listen 80;
    server_name exam.evolve.ai;

    location / {
      root /usr/share/nginx/html/exam;
      index index.html;
      try_files $uri /index.html;
    }
  }
}
