version: '3.8'

services:
  # Database
  postgres:
    image: postgres:15
    container_name: evolveai_postgres
    restart: always
    environment:
      POSTGRES_USER: evolveai_user
      POSTGRES_PASSWORD: evolveai_password
      POSTGRES_DB: evolveai_auth
    ports:
      - "6543:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - evolve-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
  mongodb:
    image: mongo:6.0
    container_name: evolveai_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - evolve-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: evolveai_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - evolve-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Microservices
  auth-service:
    build:
        context: .
        dockerfile: ./backend-service/auth-service/Dockerfile
    container_name: evolveai_auth
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - PORT=8001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - evolve-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  teacher-service:
    build:
        context: .
        dockerfile: ./backend-service/teacher-service/Dockerfile
    container_name: evolveai_teacher
    ports:
      - "8005:8005"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - PORT=8005
      - MONGO_URI=${MONGO_URI}
    networks:
      - evolve-network
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  student-service:
    build:
        context: .
        dockerfile: ./backend-service/student-service/Dockerfile
    container_name: evolveai_student
    ports:
      - "8090:8090"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - PORT=8090
      - MONGO_URI=${MONGO_URI}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - evolve-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Gateway
  api-gateway:
    build:
      context: ./backend-service/api-gateway
      dockerfile: Dockerfile
    container_name: evolveai_gateway
    environment:
      - NODE_ENV=production
      - PORT=9001
      - AUTH_SERVICE_URL=http://auth-service:8001
      - TEACHER_SERVICE_URL=http://teacher-service:8005
      - STUDENT_SERVICE_URL=http://student-service:8090
      - NOTIFICATION_SERVICE_URL=http://notification-service:8003
      - ALLOWED_ORIGINS=http://evolve.ai,http://teacher.evolve.ai,http://student.evolve.ai,http://exam.evolve.ai
    ports:
      - "9001:9001"
    depends_on:
      auth-service:
        condition: service_healthy
      teacher-service:
        condition: service_healthy
      student-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - evolve-network

  # Frontend Apps (built and served by nginx)
  evolve-main:
    build: ./Evolve-main
    container_name: evolveai_main_ui
    ports:
      - "3000:80"  # Admin
    networks:
      - evolve-network
    volumes:
    - ./frontend-dist/main:/usr/share/nginx/html/main

  evolve-teacher:
    build: ./Evolve-Teacher
    container_name: evolveai_teacher_ui
    networks:
      - evolve-network
    volumes:
    - ./frontend-dist/teacher:/usr/share/nginx/html/teacher

  evolve-student:
    build: ./Evolve-Student
    container_name: evolveai_student_ui
    networks:
      - evolve-network
    volumes:
    - ./frontend-dist/student:/usr/share/nginx/html/student

  evolve-exam:
    build: ./Evolve-Exam
    container_name: evolveai_exam_ui
    networks:
      - evolve-network
    volumes:
    - ./frontend-dist/exam:/usr/share/nginx/html/exam

  # Nginx Reverse Proxy
  nginx:
    image: nginx:latest
    container_name: evolveai_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend-dist/main:/usr/share/nginx/html/main
      - ./frontend-dist/teacher:/usr/share/nginx/html/teacher
      - ./frontend-dist/student:/usr/share/nginx/html/student
      - ./frontend-dist/exam:/usr/share/nginx/html/exam
    depends_on:
      evolve-main:
        condition: service_started
      evolve-teacher:
        condition: service_started
      evolve-student:
        condition: service_started
      evolve-exam:
        condition: service_started
      api-gateway:
        condition: service_healthy
    networks:
      - evolve-network

networks:
  evolve-network:

volumes:
  postgres_data:
  mongodb_data:
